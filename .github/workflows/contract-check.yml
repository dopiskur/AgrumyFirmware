name: Contract check

# Validates the hand-maintained firmware field lists in tools/contract-check/
# against the JSON Schemas in contracts/device-api/ - first the committed copy,
# then a fresh download of AgrumyService master's generated files, so an API-side
# DTO change surfaces here before anyone re-syncs the copy. Also cross-checks the
# same field lists against what ConfigParser.cpp actually reads off the wire, so a
# firmware-side field addition surfaces here too, not just an API-side one.
#
# Kept as its own workflow (separate from the PlatformIO build) so it stays
# fast and does not conflict-merge with build.yml.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract-check:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned (same practice as release.yml/build.yml) - a moving major tag
      # could be repointed at anything; the pinned commit is exactly what was reviewed.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - run: pip install -r tools/contract-check/requirements.txt
      - name: firmware_fields.py vs ConfigParser.cpp extraction
        run: python tools/contract-check/verify_extraction.py
      - name: Committed schema copy
        run: python tools/contract-check/check_contract.py
      - name: Download AgrumyService master schemas
        run: python tools/contract-check/sync_schemas.py --dest /tmp/upstream-contract
      - name: Warn when the committed copy is behind upstream
        run: |
          if ! diff -rq contracts/device-api /tmp/upstream-contract --exclude=README.md >/dev/null; then
            echo "::warning::contracts/device-api differs from AgrumyService master - run: python tools/contract-check/sync_schemas.py"
            diff -r contracts/device-api /tmp/upstream-contract --exclude=README.md || true
          fi
      - name: Live upstream schemas
        run: python tools/contract-check/check_contract.py --schema-dir /tmp/upstream-contract
