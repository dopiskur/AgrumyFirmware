name: PlatformIO Build

# Build-only regression gate: every push/PR must compile for every supported
# device profile. A green build on one board does not make up for a red esp32dev
# build - the classic device on the field must keep building unchanged.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [esp32dev, esp32s3usbotg, kc868-a6, esp32-s3-relay-6ch, heltec-v3, heltec-v4]
    steps:
      # Roadmap #121: SHA-pinned (same practice as release.yml) - a moving major tag could be
      # repointed at anything; the pinned commit is exactly what was reviewed.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - run: pip install --upgrade platformio
      - run: pio run -e ${{ matrix.environment }}
      # medium/high only - low is cppcheck's cross-TU-blind "unused function" noise, not real defects.
      - run: pio check -e ${{ matrix.environment }} --severity=medium --fail-on-defect=medium --skip-packages

  # Roadmap #19/#95: native (host-based) unit tests for the pure relay-decision logic
  # (src/Logic/RelayLogic.*) - a separate job, not a third matrix entry above, because it runs
  # `pio test` (build AND execute) rather than `pio run` (build only) and needs no ESP32 toolchain
  # at all, just the ubuntu-latest runner's own gcc. This is the fast regression brake for
  # interval/schedule/threshold logic changes that does not wait for a physical device.
  native-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - run: pip install --upgrade platformio
      - run: pio test -e native
