name: Firmware release

# Roadmap #94 (part A): the ONLY process that produces a tagged, versioned, downloadable .bin.
# Separate from build.yml on purpose - that one is the per-push regression gate, this one runs
# only when a semver tag is pushed and publishes a GitHub Release with one .bin per PlatformIO
# environment plus a manifest.json (SHA-256 per file) that the API's catalog sync (AgrumyService
# FirmwareCatalogService) and the offline-USB tools read.
#
# The embedded version string is DERIVED from the tag (FIRMWARE_VERSION env -> tools/
# firmware_version.py -> -DFIRMWARE_VERSION), so the tag and what the device reports in its
# heartbeat can never disagree. File names follow agrumy-<board>-v<version>.bin - the API
# rejects anything else, on every import path.
#
# Roadmap #41: each environment ALSO gets a agrumy-<board>-full-v<version>.bin - bootloader +
# partition table + boot_app0 + the OTA app above, merged via esptool merge-bin into one file
# flashable at offset 0 on a completely blank chip (the OTA .bin ALONE is only ever valid at
# offset 0x10000 on a board that already has a bootloader - see AgrumyApi's web installer,
# api.Firmware.FirmwareVersion.TryParseFullImageFileName). Offsets/flash sizes below are fixed by
# platformio.ini's board choice + the partition CSV each board's framework config selects
# (default.csv / default_8MB.csv) - not something this workflow computes, so they are pinned
# per-environment rather than discovered at build time.
#
# Usage:  git tag v1.2.3 && git push origin v1.2.3

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write   # create the release + upload assets

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        environment: [esp32dev, esp32s3usbotg, seeed_xiao_esp32c3]
    steps:
      # Roadmap #121: every Action in this file is SHA-pinned, not just softprops/action-gh-release
      # below (same practice as the scaleTrigger repo) - a moving major tag (@v4) could be
      # repointed at anything; the pinned commit is exactly what was reviewed.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # tags visible to git describe (fallback path of firmware_version.py)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - run: pip install --upgrade platformio esptool
      - name: Build ${{ matrix.environment }} with the tag as FIRMWARE_VERSION
        env:
          FIRMWARE_VERSION: ${{ github.ref_name }}
        run: pio run -e ${{ matrix.environment }}
      - name: Name the artifact by convention
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p out
          cp ".pio/build/${{ matrix.environment }}/firmware.bin" "out/agrumy-${{ matrix.environment }}-v${VERSION}.bin"
      - name: Merge into one blank-chip-flashable image (roadmap #41)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BUILD_DIR=".pio/build/${{ matrix.environment }}"
          BOOT_APP0="$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin"
          case "${{ matrix.environment }}" in
            esp32dev)
              # Classic ESP32: second-stage bootloader lives at 0x1000 (the first 4 KB is the ROM's
              # own boot header, not ours) - see FLASH_EXTRA_IMAGES in the arduino-esp32 platform's
              # platformio-build.py, which special-cases esp32/esp32s2 this way.
              CHIP=esp32; BOOTLOADER_OFFSET=0x1000; FLASH_SIZE=4MB ;;
            esp32s3usbotg)
              # Every other supported chip (S3 included) boots its bootloader from 0x0.
              CHIP=esp32s3; BOOTLOADER_OFFSET=0x0; FLASH_SIZE=8MB ;;
            seeed_xiao_esp32c3)
              # C3 (RISC-V) also boots its bootloader from 0x0, same as S3 - only classic ESP32 (Xtensa) is special-cased above. 4MB flash confirmed on real XIAO C3 hardware (esptool chip_id).
              CHIP=esp32c3; BOOTLOADER_OFFSET=0x0; FLASH_SIZE=4MB ;;
            *)
              echo "::error::no merge-bin offsets known for environment '${{ matrix.environment }}' - add a case above before adding this env to the release matrix."
              exit 1 ;;
          esac
          python3 -m esptool --chip "$CHIP" merge-bin \
            -o "out/agrumy-${{ matrix.environment }}-full-v${VERSION}.bin" \
            --flash-size "$FLASH_SIZE" \
            "$BOOTLOADER_OFFSET" "$BUILD_DIR/bootloader.bin" \
            0x8000 "$BUILD_DIR/partitions.bin" \
            0xe000 "$BOOT_APP0" \
            0x10000 "$BUILD_DIR/firmware.bin"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.environment }}
          path: out/*.bin
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: assets
          merge-multiple: true
      - name: Write manifest.json + SHA256SUMS.txt
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd assets
          sha256sum *.bin > SHA256SUMS.txt
          python3 - <<'PY'
          import hashlib, json, os, re, datetime
          repo, tag = os.environ["REPO"], os.environ["TAG"]
          version = tag[1:] if tag.startswith("v") else tag
          # Roadmap #41: the "full-" marker sits BEFORE "v" (never after the version) so it can never
          # collide with a semver pre-release tag - see AgrumyApi's FirmwareVersion.cs remarks on
          # FullImageFileNameRegex for the full reasoning (that's the consuming side; this is the
          # producing side, kept in sync by convention, not by sharing code across repos/languages).
          # Board allows '-'/'_' (kc868-a6, seeed_xiao_esp32c3); the (?<!-full) lookbehind keeps a
          # full-image name from being swallowed as board="<board>-full" with kind left unmatched -
          # without it, greedy backtracking tries board="<board>-full" (now legal chars) before
          # ever trying the shorter board+kind="full-" split that's actually correct.
          pattern = re.compile(r"^agrumy-(?P<board>[a-z0-9_-]+)(?<!-full)-(?P<kind>full-)?v(?P<version>[^/]+)\.bin$")
          files = []
          for name in sorted(os.listdir(".")):
              m = pattern.match(name)
              if not m:
                  continue
              with open(name, "rb") as f:
                  digest = hashlib.sha256(f.read()).hexdigest()
              files.append({
                  "board": m.group("board"),
                  "fileName": name,
                  "sizeBytes": os.path.getsize(name),
                  "sha256": digest,
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{name}",
                  "kind": "full" if m.group("kind") else "ota",
              })
          manifest = {
              "schemaVersion": 1,
              "generatedAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "source": f"github:{repo}",
              "releases": [{"version": version,
                            "publishedAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                            "files": files}],
          }
          with open("manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2))
          PY
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Firmware ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            assets/agrumy-*.bin
            assets/manifest.json
            assets/SHA256SUMS.txt
