; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
board_build.embed_files = data/cert/x509_crt_bundle.bin
board_build.filesystem = littlefs
extra_scripts = pre:tools/firmware_version.py
; Latest tested version: ArduinoJson 7.4.3
lib_deps =
	SPI
	arduino-libraries/NTPClient
	https://github.com/tzapu/WiFiManager
	bblanchon/ArduinoJson
	knolleary/PubSubClient
	adafruit/Adafruit Unified Sensor
	adafruit/DHT sensor library
	adafruit/Adafruit BMP085 Library
	adafruit/Adafruit BMP280 Library
	adafruit/Adafruit BME280 Library
	adafruit/Adafruit CCS811 Library
	claws/BH1750
	sparkfun/SparkFun MAX1704x Fuel Gauge Arduino Library
	paulstoffregen/OneWire
	milesburton/DallasTemperature

[env:esp32dev]
board = esp32dev
; Board name must match the release filename (agrumy-<board>-v<version>.bin) and the config-poll heartbeat Board field.
build_flags = -D AGRUMY_BOARD=\"esp32dev\"
; Classic ESP32-WROOM has no built-in USB-JTAG; esp-builtin upload protocol fails on it.
upload_protocol = esptool
; No upload_port: set it locally in platformio_override.ini (gitignored) when flashing a real unit.
; Stock default.csv left the app0/app1 OTA slots at 94%+ full with ~72KB spare while LittleFS sat
; over 98% empty - see partitions-512k-littlefs.csv for the exact split and the capacity math.
board_build.partitions = partitions-512k-littlefs.csv
test_ignore = test_native_*
; LDF scans every .cpp under src/ for #include statements regardless of #ifdef guards inside it, so
; without this exclusion it would pull RadioLib (and its flash cost) into every non-LoRa board too.
build_src_filter = +<*> -<Controller/LoRaController.cpp> -<Controller/LoRaPrivateController.cpp> -<Controller/LoRaGatewayBridgeController.cpp>

[env:esp32s3usbotg]
board = esp32s3usbotg
board_build.mcu = esp32s3
build_flags = -D AGRUMY_BOARD=\"esp32s3usbotg\"
; No upload_port: set it locally in platformio_override.ini (gitignored) when flashing a real unit.
test_ignore = test_native_*
build_src_filter = +<*> -<Controller/LoRaController.cpp> -<Controller/LoRaPrivateController.cpp> -<Controller/LoRaGatewayBridgeController.cpp>

; KC868-A6's six relays sit behind a PCF8574 I2C expander, not direct GPIO (see DeviceModel.h/RelayIO.h). Pin/I2C values are not physically verified on this project's hardware.
; No upload_port: set it locally in platformio_override.ini (gitignored) when flashing a real unit.
[env:kc868-a6]
board = esp32dev
build_flags =
	-D AGRUMY_BOARD=\"kc868-a6\"
	-D AGRUMY_KIT=\"KC868-A6\"
	-D AGRUMY_KIT_KC868_A6
upload_protocol = esptool
; Same board = esp32dev as [env:esp32dev] above, same flash-space problem, same fix.
board_build.partitions = partitions-512k-littlefs.csv
test_ignore = test_native_*
build_src_filter = +<*> -<Controller/LoRaController.cpp> -<Controller/LoRaPrivateController.cpp> -<Controller/LoRaGatewayBridgeController.cpp>

; Waveshare ESP32-S3-Relay-6CH: six relays on direct GPIO (1/2/41/42/45/46), not physically verified on this project's hardware.
[env:esp32-s3-relay-6ch]
board = esp32s3usbotg
board_build.mcu = esp32s3
build_flags =
	-D AGRUMY_BOARD=\"esp32-s3-relay-6ch\"
	-D AGRUMY_KIT=\"ESP32-S3-Relay-6CH\"
	-D AGRUMY_KIT_ESP32S3_RELAY6CH
test_ignore = test_native_*
build_src_filter = +<*> -<Controller/LoRaController.cpp> -<Controller/LoRaPrivateController.cpp> -<Controller/LoRaGatewayBridgeController.cpp>

; Profile B (LoRa, roadmap #220/#225) - TTGO LoRa32 V2.1 (SX1276, EU868), a fundamentally different
; device from every env above: no WiFi/HTTP, main.cpp branches to a separate setup()/loop() entirely
; under AGRUMY_PROFILE_LORA. Pin mapping (Controller/LoRaController.cpp) is NOT physically verified
; against real hardware, and the join/uplink cycle is untested against real ChirpStack traffic.
[env:esp32-lora]
board = esp32dev
build_flags =
	-D AGRUMY_BOARD=\"esp32-lora\"
	-D AGRUMY_PROFILE_LORA
lib_deps =
	${env.lib_deps}
	jgromes/RadioLib
upload_protocol = esptool
; No upload_port: set it locally in platformio_override.ini (gitignored) when flashing a real unit.
test_ignore = test_native_*
; This profile's main.cpp branch never touches the `mqtt` global - excluded so PubSubClient/
; WiFiClientSecure aren't linked in for nothing on a profile meant to stay minimal. The other two
; LoRa controllers are unrelated device roles (private-protocol node / gateway bridge) - excluded
; for the same "don't compile RadioLib types this env never uses" reasoning.
build_src_filter = +<*> -<Controller/MqttController.cpp> -<Controller/LoRaPrivateController.cpp> -<Controller/LoRaGatewayBridgeController.cpp>

; Private-protocol LoRa sensor node (alternative to esp32-lora's ChirpStack/LoRaWAN profile above) -
; Heltec WiFi LoRa 32 V3 (ESP32-S3+SX1262), RadioLib raw PHY with a private sync word, paired with a
; Gateway running GatewayProfile.LoRaPrivateProtocol. Real two-board uplink to a gateway bridge
; confirmed on hardware (2026-09-06) - receiving a real downlink back still unverified.
[env:esp32-lora-private]
board = heltec_wifi_lora_32_V3
build_flags =
	-D AGRUMY_BOARD=\"esp32-lora-private\"
	-D AGRUMY_PROFILE_LORA
	-D AGRUMY_LORA_TRANSPORT_PRIVATE
lib_deps =
	${env.lib_deps}
	jgromes/RadioLib
upload_protocol = esptool
; No upload_port: set it locally in platformio_override.ini (gitignored) when flashing a real unit.
test_ignore = test_native_*
build_src_filter = +<*> -<Controller/MqttController.cpp> -<Controller/LoRaController.cpp> -<Controller/LoRaGatewayBridgeController.cpp>

; The LoRa private-protocol Gateway's radio-frontend board - mains-powered, always-on, bridges raw
; RadioLib frames to/from Agrumy.Gateway over USB serial (Controller/LoRaGatewayBridgeController,
; api.Gateway.LoRaPrivate on the server side). Same board family as esp32-lora-private above. Real
; over-the-air uplink from a node and the serial link to Agrumy.Gateway confirmed on hardware
; (2026-09-06) - downlink back to a node still unverified.
[env:esp32-lora-gateway-bridge]
board = heltec_wifi_lora_32_V3
build_flags =
	-D AGRUMY_BOARD=\"esp32-lora-gateway-bridge\"
	-D AGRUMY_LORA_GATEWAY_BRIDGE
lib_deps =
	${env.lib_deps}
	jgromes/RadioLib
upload_protocol = esptool
; No upload_port: set it locally in platformio_override.ini (gitignored) when flashing a real unit.
test_ignore = test_native_*
build_src_filter = +<*> -<Controller/MqttController.cpp> -<Controller/LoRaController.cpp> -<Controller/LoRaPrivateController.cpp>

; Host-based tests for the pure decision logic (no ESP32 hardware needed); framework/lib_deps are
; cleared because the Arduino-only libs inherited from [env] don't exist for a native build.
[env:native]
platform = native
framework =
lib_deps =
; PlatformIO skips building src/ into the test binary by default; without this RelayLogic/BatteryLogic/DiscoveryLogic never get linked in.
test_build_src = yes
; Unity's double asserts (TEST_ASSERT_EQUAL_DOUBLE etc.) are compiled out by default.
; -Wall -Wextra is safe here since native builds on the host, not against ESP32 SDK headers with their own warning noise.
build_flags = -std=c++17 -D UNITY_INCLUDE_DOUBLE -Wall -Wextra
; -<*> excludes the rest of src/ first, since main.cpp and Controller/*.cpp depend on Arduino.h/WiFi.h which don't exist on native.
build_src_filter = -<*> +<Logic/RelayLogic.cpp> +<Logic/BatteryLogic.cpp> +<Logic/DiscoveryLogic.cpp> +<Logic/LoRaIntervalLogic.cpp> +<Logic/LoRaPayloadLogic.cpp> +<Logic/SleepScheduleLogic.cpp> +<Logic/LoRaPrivateFrameLogic.cpp> +<Logic/AgrumySerialFrameLogic.cpp>
test_ignore = test_embedded_*
