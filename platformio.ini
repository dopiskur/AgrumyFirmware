; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra
lib_ldf_mode = deep+
board_build.embed_files = data/cert/x509_crt_bundle.bin
board_build.filesystem = littlefs
extra_scripts = pre:tools/firmware_version.py
lib_deps =
	SPI
	arduino-libraries/NTPClient
	https://github.com/tzapu/WiFiManager
	bblanchon/ArduinoJson
	knolleary/PubSubClient
	adafruit/Adafruit Unified Sensor
	adafruit/DHT sensor library
	adafruit/Adafruit BMP085 Library
	adafruit/Adafruit BMP280 Library
	adafruit/Adafruit BME280 Library
	adafruit/Adafruit CCS811 Library
	claws/BH1750
	sparkfun/SparkFun MAX1704x Fuel Gauge Arduino Library
	paulstoffregen/OneWire
	milesburton/DallasTemperature

[env:esp32dev]
board = esp32dev
; Board name must match the release filename (agrumy-<board>-v<version>.bin) and the config-poll heartbeat Board field.
build_flags = ${env.build_flags} -D AGRUMY_BOARD=\"esp32dev\"
upload_protocol = esptool
board_build.partitions = partitions-512k-littlefs.csv
test_ignore = test_native_*
; LDF ignores #ifdef guards, so LoRa .cpp files must be excluded here or RadioLib gets linked into every non-LoRa board.
build_src_filter = +<*> -<Controller/LoRaController.cpp> -<Controller/LoRaPrivateController.cpp> -<Controller/LoRaGatewayBridgeController.cpp> -<Controller/LoRaGatewayRelayController.cpp>

[env:esp32s3usbotg]
board = esp32s3usbotg
board_build.mcu = esp32s3
build_flags = ${env.build_flags} -D AGRUMY_BOARD=\"esp32s3usbotg\"
test_ignore = test_native_*
build_src_filter = +<*> -<Controller/LoRaController.cpp> -<Controller/LoRaPrivateController.cpp> -<Controller/LoRaGatewayBridgeController.cpp> -<Controller/LoRaGatewayRelayController.cpp>

; KC868-A6's six relays sit behind a PCF8574 I2C expander, not direct GPIO (see DeviceModel.h/RelayIO.h).
; AGRUMY_LORA_GATEWAY_CAPABLE (roadmap #383) compiles in LoRaGatewayRelayController for KC868-A6's
; onboard SX1278 socket - a standalone/dual-role toggle (deviceConfig.loRaGatewayEnabled), not a
; separate profile like esp32-lora* below, so this board keeps its normal WiFi/relay/sensor role.
[env:kc868-a6]
board = esp32dev
build_flags =
	${env.build_flags}
	-D AGRUMY_BOARD=\"kc868-a6\"
	-D AGRUMY_KIT=\"KC868-A6\"
	-D AGRUMY_KIT_KC868_A6
	-D AGRUMY_LORA_GATEWAY_CAPABLE
lib_deps =
	${env.lib_deps}
	jgromes/RadioLib
upload_protocol = esptool
board_build.partitions = partitions-512k-littlefs.csv
test_ignore = test_native_*
build_src_filter = +<*> -<Controller/LoRaController.cpp> -<Controller/LoRaPrivateController.cpp> -<Controller/LoRaGatewayBridgeController.cpp>

[env:esp32-s3-relay-6ch]
board = esp32s3usbotg
board_build.mcu = esp32s3
build_flags =
	${env.build_flags}
	-D AGRUMY_BOARD=\"esp32-s3-relay-6ch\"
	-D AGRUMY_KIT=\"ESP32-S3-Relay-6CH\"
	-D AGRUMY_KIT_ESP32S3_RELAY6CH
test_ignore = test_native_*
build_src_filter = +<*> -<Controller/LoRaController.cpp> -<Controller/LoRaPrivateController.cpp> -<Controller/LoRaGatewayBridgeController.cpp> -<Controller/LoRaGatewayRelayController.cpp>

; AGRUMY_PROFILE_LORA branches main.cpp into a separate setup()/loop(), skipping WiFi/HTTP entirely.
[env:esp32-lora]
board = esp32dev
build_flags =
	-D AGRUMY_BOARD=\"esp32-lora\"
	-D AGRUMY_PROFILE_LORA
lib_deps =
	${env.lib_deps}
	jgromes/RadioLib
upload_protocol = esptool
test_ignore = test_native_*
build_src_filter = +<*> -<Controller/MqttController.cpp> -<Controller/LoRaPrivateController.cpp> -<Controller/LoRaGatewayBridgeController.cpp> -<Controller/LoRaGatewayRelayController.cpp>

; Pairs with a Gateway running GatewayProfile.LoRaPrivateProtocol (see esp32-lora-gateway-bridge below).
[env:esp32-lora-private]
board = heltec_wifi_lora_32_V3
build_flags =
	-D AGRUMY_BOARD=\"esp32-lora-private\"
	-D AGRUMY_PROFILE_LORA
	-D AGRUMY_LORA_TRANSPORT_PRIVATE
lib_deps =
	${env.lib_deps}
	jgromes/RadioLib
upload_protocol = esptool
test_ignore = test_native_*
build_src_filter = +<*> -<Controller/MqttController.cpp> -<Controller/LoRaController.cpp> -<Controller/LoRaGatewayBridgeController.cpp> -<Controller/LoRaGatewayRelayController.cpp>

; Bridges raw RadioLib frames to Agrumy.Gateway over USB serial (Controller/LoRaGatewayBridgeController).
[env:esp32-lora-gateway-bridge]
board = heltec_wifi_lora_32_V3
build_flags =
	-D AGRUMY_BOARD=\"esp32-lora-gateway-bridge\"
	-D AGRUMY_LORA_GATEWAY_BRIDGE
lib_deps =
	${env.lib_deps}
	jgromes/RadioLib
upload_protocol = esptool
test_ignore = test_native_*
build_src_filter = +<*> -<Controller/MqttController.cpp> -<Controller/LoRaController.cpp> -<Controller/LoRaPrivateController.cpp> -<Controller/LoRaGatewayRelayController.cpp>

; Standalone LoRa Gateway (roadmap #383) - a minimal WiFi-only Agrumy device (no relays/sensors of
; its own) whose sole job is relaying private-protocol uplinks from nearby LoRa-only nodes via its
; own WiFi/HTTP connection (LoRaGatewayRelayController), no separate serial-attached bridge board
; or Agrumy.Gateway process needed. Heltec V4 needs its own env once PlatformIO ships a board
; definition for it - not available as of this writing (espressif32 platform has V2/V3 only).
[env:heltec-lora-gateway]
board = heltec_wifi_lora_32_V3
build_flags =
	-D AGRUMY_BOARD=\"heltec-lora-gateway\"
	-D AGRUMY_LORA_GATEWAY_CAPABLE
lib_deps =
	${env.lib_deps}
	jgromes/RadioLib
upload_protocol = esptool
test_ignore = test_native_*
build_src_filter = +<*> -<Controller/LoRaController.cpp> -<Controller/LoRaPrivateController.cpp> -<Controller/LoRaGatewayBridgeController.cpp>

; framework/lib_deps cleared: the Arduino-only libs from [env] don't build natively.
[env:native]
platform = native
framework =
lib_deps =
test_build_src = yes
build_flags = -std=c++17 -D UNITY_INCLUDE_DOUBLE -Wall -Wextra
; -<*> excludes src/ first since main.cpp/Controller/*.cpp depend on Arduino.h/WiFi.h, unavailable on native.
build_src_filter = -<*> +<Logic/RelayLogic.cpp> +<Logic/BatteryLogic.cpp> +<Logic/DiscoveryLogic.cpp> +<Logic/LoRaIntervalLogic.cpp> +<Logic/LoRaPayloadLogic.cpp> +<Logic/SleepScheduleLogic.cpp> +<Logic/LoRaPrivateFrameLogic.cpp> +<Logic/AgrumySerialFrameLogic.cpp> +<Logic/HttpDateLogic.cpp>
test_ignore = test_embedded_*
