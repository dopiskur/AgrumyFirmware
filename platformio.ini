; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Standard WiFi board - what "PlatformIO: Build" runs with no explicit -e, if the VS Code status bar's own active-environment selector isn't overriding it.
default_envs = esp32dev

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra
lib_ldf_mode = deep+
board_build.embed_files = data/cert/x509_crt_bundle.bin
board_build.filesystem = littlefs
extra_scripts = pre:tools/firmware_version.py
lib_deps =
	SPI
	arduino-libraries/NTPClient
	https://github.com/tzapu/WiFiManager
	bblanchon/ArduinoJson
	knolleary/PubSubClient
	adafruit/Adafruit Unified Sensor
	adafruit/DHT sensor library
	adafruit/Adafruit BMP085 Library
	adafruit/Adafruit BMP280 Library
	adafruit/Adafruit BME280 Library
	adafruit/Adafruit CCS811 Library
	claws/BH1750
	sparkfun/SparkFun MAX1704x Fuel Gauge Arduino Library
	paulstoffregen/OneWire
	milesburton/DallasTemperature
	adafruit/Adafruit MAX31855 library
	adafruit/Adafruit MAX31856 library
	adafruit/Adafruit MAX31865 library
	adafruit/Adafruit MLX90614 Library
	adafruit/Adafruit MCP9808 Library
	adafruit/Adafruit AHTX0
	adafruit/Adafruit AM2320 sensor library
	adafruit/Adafruit HTU21DF Library
	adafruit/Adafruit Si7021 Library
	adafruit/Adafruit SHT31 Library
	adafruit/Adafruit SHT4x Library
	adafruit/Adafruit SHTC3 Library
	adafruit/Adafruit BME680 Library
	adafruit/Adafruit DPS310
	sensirion/Sensirion I2C SCD30
	sensirion/Sensirion I2C SCD4x
	strange-v/MHZ19
	apollon77/I2CSoilMoistureSensor
	mulmer89/EZO I2C Sensors
	anyleaf/Anyleaf
	adafruit/Adafruit ADS1X15
	adafruit/Adafruit TSL2561
	adafruit/Adafruit TSL2591 Library
	adafruit/Adafruit SI1145 Library
	adafruit/Adafruit LTR390 Library
	adafruit/Adafruit VEML7700 Library
	adafruit/Adafruit AS7341
	bogde/HX711

[env:esp32dev]
board = esp32dev
; Board name must match the release filename (agrumy-<board>-v<version>.bin) and the config-poll heartbeat Board field.
build_flags = ${env.build_flags} -D AGRUMY_BOARD=\"esp32dev\"
upload_protocol = esptool
board_build.partitions = partitions-512k-littlefs.csv
test_ignore = test_native_*
; LDF ignores #ifdef guards, so LoRa .cpp files must be excluded here or RadioLib gets linked into every non-LoRa board. Same reason DisplayController.cpp (roadmap #133, KC868-A6-only OLED) is excluded - it would otherwise pull the Adafruit SSD1306/GFX libs into every board's build.
build_src_filter = +<*> -<Controller/LoRaController.cpp> -<Controller/LoRaPrivateController.cpp> -<Controller/LoRaGatewayBridgeController.cpp> -<Controller/LoRaGatewayRelayController.cpp> -<Controller/DisplayController.cpp>

[env:esp32s3usbotg]
board = esp32s3usbotg
board_build.mcu = esp32s3
build_flags = ${env.build_flags} -D AGRUMY_BOARD=\"esp32s3usbotg\"
test_ignore = test_native_*
build_src_filter = +<*> -<Controller/LoRaController.cpp> -<Controller/LoRaPrivateController.cpp> -<Controller/LoRaGatewayBridgeController.cpp> -<Controller/LoRaGatewayRelayController.cpp> -<Controller/DisplayController.cpp>

[env:kc868-a6]
board = esp32dev
build_flags =
	${env.build_flags}
	-D AGRUMY_BOARD=\"kc868-a6\"
	-D AGRUMY_KIT=\"KC868-A6\"
	-D AGRUMY_KIT_KC868_A6
	-D AGRUMY_LORA_GATEWAY_CAPABLE
lib_deps =
	${env.lib_deps}
	jgromes/RadioLib
	adafruit/Adafruit SSD1306
	adafruit/Adafruit GFX Library
upload_protocol = esptool
board_build.partitions = partitions-512k-littlefs.csv
test_ignore = test_native_*
build_src_filter = +<*> -<Controller/LoRaController.cpp> -<Controller/LoRaPrivateController.cpp> -<Controller/LoRaGatewayBridgeController.cpp>

[env:esp32-s3-relay-6ch]
board = esp32s3usbotg
board_build.mcu = esp32s3
build_flags =
	${env.build_flags}
	-D AGRUMY_BOARD=\"esp32-s3-relay-6ch\"
	-D AGRUMY_KIT=\"ESP32-S3-Relay-6CH\"
	-D AGRUMY_KIT_ESP32S3_RELAY6CH
test_ignore = test_native_*
build_src_filter = +<*> -<Controller/LoRaController.cpp> -<Controller/LoRaPrivateController.cpp> -<Controller/LoRaGatewayBridgeController.cpp> -<Controller/LoRaGatewayRelayController.cpp> -<Controller/DisplayController.cpp>

; AGRUMY_PROFILE_LORA branches main.cpp into a separate setup()/loop(), skipping WiFi/HTTP entirely.
[env:esp32-lora]
board = esp32dev
build_flags =
	-D AGRUMY_BOARD=\"esp32-lora\"
	-D AGRUMY_PROFILE_LORA
lib_deps =
	${env.lib_deps}
	jgromes/RadioLib
upload_protocol = esptool
test_ignore = test_native_*
build_src_filter = +<*> -<Controller/MqttController.cpp> -<Controller/LoRaPrivateController.cpp> -<Controller/LoRaGatewayBridgeController.cpp> -<Controller/LoRaGatewayRelayController.cpp> -<Controller/DisplayController.cpp>

; Pairs with a Gateway running GatewayProfile.LoRaPrivateProtocol (see esp32-lora-gateway-bridge below).
[env:esp32-lora-private]
board = heltec_wifi_lora_32_V3
build_flags =
	-D AGRUMY_BOARD=\"esp32-lora-private\"
	-D AGRUMY_PROFILE_LORA
	-D AGRUMY_LORA_TRANSPORT_PRIVATE
lib_deps =
	${env.lib_deps}
	jgromes/RadioLib
upload_protocol = esptool
test_ignore = test_native_*
build_src_filter = +<*> -<Controller/MqttController.cpp> -<Controller/LoRaController.cpp> -<Controller/LoRaGatewayBridgeController.cpp> -<Controller/LoRaGatewayRelayController.cpp> -<Controller/DisplayController.cpp>

; Bridges raw RadioLib frames to Agrumy.Gateway over USB serial (Controller/LoRaGatewayBridgeController).
[env:esp32-lora-gateway-bridge]
board = heltec_wifi_lora_32_V3
build_flags =
	-D AGRUMY_BOARD=\"esp32-lora-gateway-bridge\"
	-D AGRUMY_LORA_GATEWAY_BRIDGE
lib_deps =
	${env.lib_deps}
	jgromes/RadioLib
upload_protocol = esptool
test_ignore = test_native_*
build_src_filter = +<*> -<Controller/MqttController.cpp> -<Controller/LoRaController.cpp> -<Controller/LoRaPrivateController.cpp> -<Controller/LoRaGatewayRelayController.cpp> -<Controller/DisplayController.cpp>

[env:heltec-lora-gateway]
board = heltec_wifi_lora_32_V3
build_flags =
	-D AGRUMY_BOARD=\"heltec-lora-gateway\"
	-D AGRUMY_LORA_GATEWAY_CAPABLE
lib_deps =
	${env.lib_deps}
	jgromes/RadioLib
upload_protocol = esptool
test_ignore = test_native_*
build_src_filter = +<*> -<Controller/LoRaController.cpp> -<Controller/LoRaPrivateController.cpp> -<Controller/LoRaGatewayBridgeController.cpp> -<Controller/DisplayController.cpp>

[env:native]
platform = native
framework =
lib_deps =
test_build_src = yes
build_flags = -std=c++17 -D UNITY_INCLUDE_DOUBLE -Wall -Wextra
; -<*> excludes src/ first since main.cpp/Controller/*.cpp depend on Arduino.h/WiFi.h, unavailable on native.
build_src_filter = -<*> +<Logic/RelayLogic.cpp> +<Logic/BatteryLogic.cpp> +<Logic/DiscoveryLogic.cpp> +<Logic/LoRaIntervalLogic.cpp> +<Logic/LoRaPayloadLogic.cpp> +<Logic/SleepScheduleLogic.cpp> +<Logic/LoRaPrivateFrameLogic.cpp> +<Logic/AgrumySerialFrameLogic.cpp> +<Logic/HttpDateLogic.cpp> +<Logic/CommandReplayLogic.cpp> +<Logic/LoRaPrivatePayloadFramingLogic.cpp>
test_ignore = test_embedded_*
